server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;

    # HSTS: solo se servito sempre e solo in HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cosucce.go-pucci.com; media-src 'self' https://cosucce.go-pucci.com; connect-src 'self' https://cosucce.go-pucci.com https://identitytoolkit.googleapis.com; frame-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none';" always;

    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Reindirizza tutte le rotte verso index.html per la gestione di vue-router
        try_files $uri $uri/ /index.html;

        expires off;
    }

    # Cache aggressiva per gli asset statici con hash nel nome
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Gli header aggiunti sopra vanno ripetuti qui, perché add_header
        # non è ereditato da un location che ne definisce di propri
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
